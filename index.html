<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1b1916" />

    <title>Sena Hotel & Resort | Hotel in Ajao Estate, Lagos near the Airport</title>
    <meta
      name="description"
      content="Sena Hotel & Resort is a 3-star hotel in Ajao Estate, Oshodi-Isolo, Lagos, about 17 minutes by car from Murtala Muhammed International Airport. Rooms, restaurant, bar and lounge, and a 24-hour front desk."
    />
    <meta
      name="keywords"
      content="Sena Hotel Lagos, Sena Hotel and Resort Lagos, hotel in Ajao Estate, hotels near Lagos airport, hotels in Oshodi Isolo Lagos"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sena Hotel & Resort" />
    <meta property="og:title" content="Sena Hotel & Resort | Comfort, Convenience & Hospitality in Lagos" />
    <meta
      property="og:description"
      content="A welcoming 3-star hotel in Ajao Estate, Lagos, with comfortable rooms, dining, attentive service and convenient access to the airport."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:locale" content="en_NG" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data: Hotel. No rating/review schema on purpose. Add "telephone", "url" and "sameAs" once confirmed. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Hotel",
        "name": "Sena Hotel & Resort",
        "description": "3-star hotel in Ajao Estate, Oshodi-Isolo, Lagos, Nigeria, approximately 17 minutes by car from Murtala Muhammed International Airport.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "3 Ahanor Drive, Behind CHI Limited, Ajao Estate",
          "addressLocality": "Oshodi-Isolo",
          "addressRegion": "Lagos",
          "addressCountry": "NG"
        },
        "starRating": { "@type": "Rating", "ratingValue": "3" },
        "amenityFeature": [
          { "@type": "LocationFeatureSpecification", "name": "Air conditioning", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Free Wi-Fi", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "On-site parking", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Restaurant", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Bar and lounge", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Room service", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "24-hour front desk", "value": true }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
